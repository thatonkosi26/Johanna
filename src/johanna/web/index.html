<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b1016">
    <title>Johanna — Forex workstation</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#overview" aria-label="Johanna overview">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>JOHANNA</strong><small>FOREX WORKSTATION</small></span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav id="primary-nav" aria-label="Main navigation"></nav>
        <div class="sidebar-bottom">
          <div class="terminal-state"><span class="state-dot" id="sidebar-dot"></span><span id="sidebar-state">Connecting to backend</span></div>
          <div class="sidebar-version">LOCAL WORKSTATION <span>·</span> 0.1.0</div>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="topbar-brand"><span class="mini-mark">J</span><span>Johanna</span></div>
          <div class="top-status" id="top-status" aria-live="polite"></div>
          <div class="topbar-right">
            <span class="mode-label" id="mode-label">MANUAL</span>
            <button class="icon-button settings-shortcut" data-page="settings" aria-label="Open settings" title="Settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3H3.8a1.8 1.8 0 0 1 0-3.6H4a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0V2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6H20a1.8 1.8 0 0 0-.6 3Z" transform="translate(0 1.4) scale(.92)"/></svg>
            </button>
          </div>
        </header>

        <main id="main-content" tabindex="-1">
          <div class="loading-screen"><span class="loader"></span><span>Loading workstation state</span></div>
        </main>
        <footer class="app-footer"><span>JOHANNA WORKSTATION</span><span id="footer-clock">—</span><span>DATA FROM CONNECTED PROVIDERS</span></footer>
      </div>
      <div class="mobile-scrim" id="mobile-scrim"></div>
    </div>
  </body>
</html>
