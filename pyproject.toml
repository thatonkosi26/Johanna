[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "johanna-forex-assistant"
version = "0.1.0"
description = "Persistent Forex trading workstation and agent foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - educational research project" }
dependencies = ["pyarrow>=16", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7,<5",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
johanna = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "browser: headless-browser dashboard smoke tests (skipped when no Chromium browser is installed)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

